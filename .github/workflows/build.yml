name: Build & Release APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.2
        with:
          gradle-version: 8.13

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Translator.apk

      - name: Upload Build Log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-logs
          path: build-log.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | cut -d '"' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare Release Notes
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "نسخه ${VERSION} مترجم شناور: بهبود عملکرد و قابلیت‌های جدید." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: dist/Translator.apk
          draft: false
          prerelease: false

      - name: Upload APK Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: translator-apk
          path: dist/Translator.apk
          retention-days: 14
          if-no-files-found: error
